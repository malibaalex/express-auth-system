<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>Choose a new password · Atlas</title>
    <link rel="stylesheet" href="/app/css/style.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <a class="brand" href="/app/" aria-label="Atlas sign in"
          ><span class="brand-mark" aria-hidden="true">A</span
          ><span>Atlas</span></a
        >
        <p class="eyebrow">STEP 2 OF 2</p>
        <h1 id="page-title">Choose a new password</h1>
        <p class="muted">
          Enter the six-digit code from your email, then choose a password you
          haven't used here before.
        </p>
        <div
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <form id="reset-form" class="form">
          <label for="email"
            >Email address<input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="254"
              placeholder="you@example.com"
          /></label>
          <label for="code"
            >Reset code<input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              minlength="6"
              maxlength="6"
              required
              placeholder="Six-digit code"
          /></label>
          <label for="password"
            >New password<input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="8–128 characters"
          /></label>
          <label for="confirmPassword"
            >Confirm new password<input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="Enter the password again"
          /></label>
          <button class="button primary" type="submit">Update password</button>
        </form>
        <p class="footnote">
          <a href="/app/forgot.html">Request another code</a
          ><span aria-hidden="true"> · </span
          ><a href="/app/">Back to sign in</a>
        </p>
      </section>
    </main>
    <script type="module" src="/app/js/reset.js"></script>
  </body>
</html>
