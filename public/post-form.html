<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write a post · Atlas</title>
    <link rel="stylesheet" href="/app/css/style.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <a class="brand" href="/app/app.html"
          ><span class="brand-mark" aria-hidden="true">A</span
          ><span>Atlas</span></a
        >
        <nav class="topnav" aria-label="Main navigation">
          <a class="nav-link" href="/app/posts.html">Posts</a
          ><a class="nav-link" href="/app/app.html">Account</a
          ><button id="logout" class="button secondary small" type="button">
            Sign out
          </button>
        </nav>
      </header>
      <section class="editor-card">
        <a class="back-link" href="/app/posts.html">← All posts</a>
        <p class="eyebrow" id="form-eyebrow">NEW POST</p>
        <h1 id="form-title">Write a post</h1>
        <p class="muted">
          A clear title helps readers understand what your post is about. You
          can use up to 150 characters for the title and 10,000 for the content.
        </p>
        <div
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <form id="post-form" class="form">
          <label for="title"
            >Title<input
              id="title"
              name="title"
              type="text"
              maxlength="150"
              required
              placeholder="Give your post a clear title"
          /></label>
          <label for="content"
            >Content<textarea
              id="content"
              name="content"
              rows="14"
              maxlength="10000"
              required
              placeholder="Start writing…"
            ></textarea>
          </label>
          <div class="editor-footer">
            <span id="content-count" class="muted inline" aria-live="polite"
              >0 / 10,000</span
            >
            <div class="editor-actions">
              <a class="button secondary" href="/app/posts.html">Cancel</a
              ><button class="button primary" type="submit">
                Publish post
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/app/js/post-form.js"></script>
  </body>
</html>
