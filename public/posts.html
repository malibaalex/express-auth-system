<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>Posts · Atlas</title>
    <link rel="stylesheet" href="/app/css/style.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <a class="brand" href="/app/app.html"
          ><span class="brand-mark" aria-hidden="true">A</span
          ><span>Atlas</span></a
        >
        <nav class="topnav" aria-label="Main navigation">
          <a class="nav-link active" href="/app/posts.html" aria-current="page"
            >Posts</a
          ><a class="nav-link" href="/app/app.html">Account</a
          ><button id="logout" class="button secondary small" type="button">
            Sign out
          </button>
        </nav>
      </header>
      <section class="workspace-head">
        <div>
          <p class="eyebrow">PUBLISHING WORKSPACE</p>
          <h1>Posts</h1>
          <p class="muted">
            Browse posts from the workspace. You can edit and delete the posts
            you own.
          </p>
        </div>
        <a class="button primary" href="/app/post-form.html">Write a post</a>
      </section>
      <div class="ownership-key" aria-label="Post permissions">
        <span class="ownership-key-item"
          ><span class="ownership-dot own"></span>Your post — editable</span
        ><span class="ownership-key-item"
          ><span class="ownership-dot other"></span>Another author's post — read
          only</span
        >
      </div>
      <div
        id="notice"
        class="notice"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <section
        id="posts-list"
        class="post-list"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="empty-state">
          <span class="loading-dot" aria-hidden="true"></span>
          <p>Loading posts…</p>
        </div>
      </section>
      <div class="pagination" aria-label="Post pages">
        <button
          id="previous"
          class="button secondary small"
          type="button"
          disabled
        >
          Previous</button
        ><span id="page-indicator" class="muted inline" aria-live="polite"
          >Page 1</span
        ><button
          id="next"
          class="button secondary small"
          type="button"
          disabled
        >
          Next
        </button>
      </div>
      <footer class="workspace-footer">
        <a href="/app/testing.md">Testing guide</a
        ><span>Atlas publishing workspace</span>
      </footer>
    </main>
    <script type="module" src="/app/js/posts.js"></script>
  </body>
</html>
