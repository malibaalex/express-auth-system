name: AUTH_SYSTEM_CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test
      PORT: 0
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=public
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      GOOGLE_START_PATH: /auth/google/start
      APP_URL: http://localhost:3000
      RESEND_API_KEY: test-resend-api-key
      EMAIL_FROM: onboarding@example.com
      JWT_ACCESS_SECRET_KEY: test-access-secret
      JWT_ACCESS_SECRET_KEY_EXPIRES_IN: 900
      JWT_REFRESH_SECRET_KEY: test-refresh-secret
      JWT_REFRESH_SECRET_KEY_EXPIRES_IN: 604800
      COOKIE_SECRET: test-cookie-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint, format check and typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
